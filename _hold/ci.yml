name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试向量与构建探针 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 确定性引用自检与知识图谱测试向量（24 组）
        run: python tests/test_citation_audit.py

      - name: TeamAgentSpec 构建探针
        run: python probe_build.py 2>&1 | grep -E "build\(\) 成功|结论" || true

      - name: 端到端演示（不需要模型）
        run: python run_offline_demo.py > /tmp/demo.log 2>&1 && tail -n 20 /tmp/demo.log

      - name: 校验交付物含两张原生表格
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          files = sorted(glob.glob("runtime/deliverable_*.docx"))
          if not files:
              sys.exit("未找到交付物 .docx")
          latest = files[-1]
          with zipfile.ZipFile(latest) as z:
              xml = z.read("word/document.xml").decode("utf-8")
          tables = xml.count("<w:tbl>")
          print(f"交付物：{latest}  表格数：{tables}")
          if tables < 2:
              sys.exit(f"期望至少 2 张表格，实得 {tables}")
          PY
